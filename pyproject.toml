[project]
name = "mlp-hardware-accelerator"
version = "1.1.0"
description = "Fixed-point MLP FPGA accelerator: PyTorch training + VHDL inference"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pytest>=7.0.0",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
