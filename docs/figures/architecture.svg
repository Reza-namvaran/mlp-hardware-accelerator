<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 460" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>

  <rect width="880" height="460" fill="#ffffff"/>

  <!-- Input buffer -->
  <rect x="340" y="20" width="200" height="50" rx="6" fill="#EDF2F7" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="440" y="42" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2733">Input buffer</text>
  <text x="440" y="59" text-anchor="middle" font-size="11" fill="#4a5a6a">784 x Q8.8 pixels</text>

  <line x1="440" y1="70" x2="440" y2="98" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hidden dense_layer -->
  <rect x="300" y="100" width="280" height="60" rx="6" fill="#E8F0FE" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="440" y="126" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2733">dense_layer  (H = 16, ReLU)</text>
  <text x="440" y="144" text-anchor="middle" font-size="11" fill="#4a5a6a">N_PARALLEL neuron/MAC lanes per group</text>

  <!-- ROM W1/B1 -->
  <rect x="640" y="105" width="150" height="50" rx="6" fill="#FDF3E7" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="715" y="127" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2733">rom_weights</text>
  <text x="715" y="144" text-anchor="middle" font-size="11" fill="#4a5a6a">W1 / B1</text>
  <line x1="640" y1="130" x2="582" y2="130" stroke="#C97A2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="440" y1="160" x2="440" y2="188" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Hidden buffer -->
  <rect x="340" y="190" width="200" height="50" rx="6" fill="#EDF2F7" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="440" y="212" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2733">Hidden buffer</text>
  <text x="440" y="229" text-anchor="middle" font-size="11" fill="#4a5a6a">16 x Q8.8</text>

  <line x1="440" y1="240" x2="440" y2="268" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Output dense_layer -->
  <rect x="300" y="270" width="280" height="60" rx="6" fill="#E8F0FE" stroke="#2E86AB" stroke-width="1.5"/>
  <text x="440" y="296" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2733">dense_layer  (O = 10, no ReLU)</text>
  <text x="440" y="314" text-anchor="middle" font-size="11" fill="#4a5a6a">N_PARALLEL neuron/MAC lanes per group</text>

  <!-- ROM W2/B2 -->
  <rect x="640" y="275" width="150" height="50" rx="6" fill="#FDF3E7" stroke="#C97A2B" stroke-width="1.5"/>
  <text x="715" y="297" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2733">rom_weights</text>
  <text x="715" y="314" text-anchor="middle" font-size="11" fill="#4a5a6a">W2 / B2</text>
  <line x1="640" y1="300" x2="582" y2="300" stroke="#C97A2B" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="440" y1="330" x2="440" y2="358" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Argmax -->
  <rect x="340" y="360" width="200" height="50" rx="6" fill="#EAF7F0" stroke="#2E9E6C" stroke-width="1.5"/>
  <text x="440" y="382" text-anchor="middle" font-size="14" font-weight="600" fill="#1a2733">argmax</text>
  <text x="440" y="399" text-anchor="middle" font-size="11" fill="#4a5a6a">10-way winner-take-all</text>

  <line x1="440" y1="410" x2="440" y2="438" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="440" y="454" text-anchor="middle" font-size="12" font-weight="600" fill="#1a2733">class_out [3:0]</text>

  <!-- Left annotation: controller -->
  <rect x="40" y="150" width="180" height="70" rx="6" fill="#F5F0FA" stroke="#7E57C2" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="130" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#1a2733">controller / mlp_top</text>
  <text x="130" y="192" text-anchor="middle" font-size="11" fill="#4a5a6a">IDLE-&gt;LOAD-&gt;RUN_H-&gt;</text>
  <text x="130" y="207" text-anchor="middle" font-size="11" fill="#4a5a6a">RUN_O-&gt;FINISH</text>
  <line x1="220" y1="185" x2="298" y2="130" stroke="#7E57C2" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="220" y1="185" x2="298" y2="300" stroke="#7E57C2" stroke-width="1" stroke-dasharray="4,3"/>
</svg>
